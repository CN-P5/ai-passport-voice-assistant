name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AiPassportVoice.sln

      - name: Self test
        run: dotnet run --project tests/AiPassportVoice.SelfTest -c Release

      - name: Publish single file
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/AiPassportVoice.App/AiPassportVoice.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=$version `
            -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AiPassportVoice-${{ github.ref_name }}
          path: dist/AiPassportVoice.exe
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: AI Passport 语音助手 ${{ github.ref_name }}
          files: dist/AiPassportVoice.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
